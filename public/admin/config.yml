# Panel de contenido de Cerraya (Decap CMS) en cerraya.com/admin
# Inicia sesión con GitHub a través del proveedor OAuth de Netlify (ver README).
backend:
  name: github
  repo: marlonjimenezv/CERRAYA
  branch: main
  base_url: https://api.netlify.com
  commit_messages:
    create: 'Consejo nuevo: {{slug}}'
    update: 'Actualiza consejo: {{slug}}'
    delete: 'Elimina consejo: {{slug}}'
    uploadMedia: 'Sube foto: {{path}}'
    deleteMedia: 'Elimina foto: {{path}}'

locale: es
site_url: https://cerraya.com
display_url: https://cerraya.com
logo_url: https://cerraya.com/img/logo-cerraya.png

# Las fotos se guardan en src/assets para que Astro las optimice (webp, varios tamaños).
media_folder: src/assets/consejos
public_folder: ../../assets/consejos

collections:
  - name: consejos
    label: Consejos
    label_singular: Consejo
    description: Artículos y respuestas a preguntas de clientes en cerraya.com/consejos
    folder: src/content/consejos
    create: true
    slug: '{{slug}}'
    summary: '{{titulo}} · {{categoria}}'
    sortable_fields: ['fecha', 'titulo']
    media_folder: ../../assets/consejos
    public_folder: ../../assets/consejos
    fields:
      - { label: Título, name: titulo, widget: string }
      - { label: Descripción corta, name: descripcion, widget: text, hint: 'Una o dos frases. Sale en Google y en la lista de consejos.' }
      - { label: Fecha, name: fecha, widget: datetime, date_format: 'DD/MM/YYYY', time_format: false, format: 'YYYY-MM-DD' }
      - label: Tema
        name: categoria
        widget: select
        options: ['Guías', 'Puertas de vidrio', 'Seguridad', 'Urgencias', 'Llaves de carro', 'Preguntas de clientes']
      - { label: Imagen (opcional), name: imagen, widget: image, required: false, choose_url: false }
      - { label: Destacar, name: destacado, widget: boolean, default: false, required: false }
      - { label: Texto, name: body, widget: markdown }
